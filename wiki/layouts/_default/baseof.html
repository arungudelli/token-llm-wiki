<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .Title }}{{ .Title }} · {{ end }}{{ .Site.Title }}</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:860px;margin:0 auto;padding:1.5rem;line-height:1.55;color:#1a1a1a}
nav{margin-bottom:1.5rem;padding-bottom:.75rem;border-bottom:1px solid #e5e5e5}
nav a{margin-right:1rem;text-decoration:none;color:#2b6cb0}
code{background:#f3f3f3;padding:.1em .35em;border-radius:3px;font-size:.9em}
pre{background:#f6f8fa;padding:1rem;border-radius:6px;overflow:auto}
pre code{background:none;padding:0}
table{border-collapse:collapse;width:100%;margin:1rem 0}
th,td{border:1px solid #ddd;padding:.4rem .6rem;text-align:left;vertical-align:top}
th{background:#fafafa}
h1{margin-top:0}
blockquote{border-left:3px solid #ddd;margin:1rem 0;padding:.25rem 1rem;color:#555}
</style>
</head>
<body>
<nav>
<a href="/">Home</a>
<a href="/wiki-index/">Wiki Index</a>
<a href="/pages/">Pages</a>
<a href="/app/">Live App ↗</a>
</nav>
<main>{{ block "main" . }}{{ end }}</main>
</body>
</html>
