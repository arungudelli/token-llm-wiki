name: Deploy wiki + app to GitHub Pages

# Publishes BOTH from one Pages deployment:
#   Hugo facts wiki  -> site root  (/token-llm-wiki/)
#   Angular app      -> /app/      (/token-llm-wiki/app/)

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - 'app/**'
      - '.github/workflows/hugo.yml'
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.162.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Angular 20 CLI requires Node >= 22.22.3
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build the Hugo wiki (site root)
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --source wiki \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Build the Angular app (served under /app/)
        working-directory: app
        run: |
          npm ci
          npx ng build --configuration production \
            --base-href "${{ steps.pages.outputs.base_path }}/app/"
      - name: Assemble app into the wiki output at /app/
        run: |
          mkdir -p wiki/public/app
          cp -r app/dist/app/browser/. wiki/public/app/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./wiki/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
